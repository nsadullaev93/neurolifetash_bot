# Этот файл нужно положить в репозиторий как .github/workflows/db-size.yml (создать на сайте GitHub: Add file → Create new file).
# Размер базы: сколько занято из лимита Neon, какие таблицы больше всего, сколько весит одно занятие.
# Только читает базу — ничего не меняет. Запуск вручную: Actions → «Размер базы» → Run workflow.
# Отчёт приходит Главному администратору в Telegram и виден на странице запуска.
# Секреты — те же, что у ночной копии: DATABASE_URL, BOT_TOKEN, SUPER_ADMIN_TG_ID.
name: Размер базы

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      SUPER_ADMIN_TG_ID: ${{ secrets.SUPER_ADMIN_TG_ID }}
      LIMIT_MB: 512  # бесплатный тариф Neon — 0,5 ГБ на проект
    steps:
      - name: Проверка секретов
        run: |
          for v in DATABASE_URL BOT_TOKEN SUPER_ADMIN_TG_ID; do
            [ -n "${!v}" ] || { echo "Не задан секрет $v"; exit 1; }
          done

      - name: Клиент PostgreSQL
        run: sudo apt-get install -y -qq postgresql-client > /dev/null

      - name: Отчёт
        run: |
          set -euo pipefail
          # только чтение: даже ошибочный запрос ничего не изменит
          q() { psql -X -q -At -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -c "$1" "$DATABASE_URL"; }

          TOTAL=$(q "select pg_database_size(current_database())")
          TOTAL_MB=$(awk "BEGIN {printf \"%.1f\", $TOTAL/1048576}")
          PCT=$(awk "BEGIN {printf \"%.1f\", $TOTAL/1048576/$LIMIT_MB*100}")

          # таблицы: размер с индексами и число строк (точно — база небольшая)
          TABLES=$(q "select string_agg(line, E'\n' order by size desc) from (
                        select pg_total_relation_size(c.oid) as size,
                               format('%s — %s КБ, строк: %s', c.relname,
                                      round(pg_total_relation_size(c.oid) / 1024.0),
                                      (xpath('/row/n/text()', query_to_xml(format('select count(*) as n from %I', c.relname), false, true, '')))[1]::text) as line
                        from pg_class c join pg_namespace n on n.oid = c.relnamespace
                        where n.nspname = 'public' and c.relkind = 'r'
                        order by 1 desc limit 12) t")

          # сколько в среднем занимает одно занятие вместе с отметками, журналом и учётом уведомлений
          LESSONS=$(q "select count(*) from lessons")
          PER_LESSON=$(q "select case when count(*) = 0 then '—' else round((
                              pg_total_relation_size('lessons') + pg_total_relation_size('lesson_marks')
                              + pg_total_relation_size('audit_log') + pg_total_relation_size('notification_log')
                            ) / 1024.0 / count(*), 1)::text || ' КБ' end from lessons")
          CHILDREN=$(q "select count(*) from children")
          USERS=$(q "select string_agg(format('%s: %s', coalesce(role, 'без роли'), n), ', ' order by n desc)
                     from (select role, count(*) n from users group by role) t")
          SINCE=$(q "select coalesce(to_char(min(created_at) at time zone 'Asia/Tashkent', 'DD.MM.YYYY'), '—') from audit_log")

          REPORT="📊 Размер базы — $(TZ=Asia/Tashkent date '+%d.%m.%Y %H:%M')
          Занято: $TOTAL_MB МБ из $LIMIT_MB МБ ($PCT %)
          Данные с: $SINCE
          Детей: $CHILDREN · занятий: $LESSONS
          Пользователи — $USERS
          Одно занятие (с отметками, журналом, уведомлениями): $PER_LESSON

          Самые большие таблицы:
          $TABLES"
          echo "$REPORT"
          echo "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          curl -sS --fail-with-body -o resp.json https://api.telegram.org/bot${BOT_TOKEN}/sendMessage \
            -d chat_id="$SUPER_ADMIN_TG_ID" --data-urlencode text="$REPORT"
          grep -q '"ok":true' resp.json

      - name: Сообщить о сбое
        if: failure()
        run: |
          curl -sS https://api.telegram.org/bot${BOT_TOKEN}/sendMessage \
            -d chat_id="$SUPER_ADMIN_TG_ID" \
            --data-urlencode text="⚠️ Отчёт о размере базы не получился. Подробности: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
